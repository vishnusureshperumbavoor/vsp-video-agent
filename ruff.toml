# Lint configuration.
#
# Ratchet rule: this file may gain rules, not lose them. Vendored code is
# excluded because it is frozen by a checksum in quality/budgets.json.

line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "server/jarvis",   # vendored + checksummed; do not lint or edit
    "public",
    "quality",
]

[lint]
select = [
    "E4",   # import syntax
    "E7",   # statements
    "E9",   # runtime errors
    "F",    # pyflakes
    "I",    # import order
    "UP",   # pyupgrade
    "B",    # bugbear
]

[lint.per-file-ignores]
"tests/*" = ["B011"]           # assert False is fine in tests
"server/main.py" = ["B008"]    # File(...) / BackgroundTasks() defaults are FastAPI's API
